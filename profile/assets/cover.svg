<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Reyhane.info organization cover</title>
  <desc id="desc">Dark red and black cover for the Reyhane.info digital platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="0.5" stop-color="#111116"/>
      <stop offset="1" stop-color="#21090e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef233c" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#ba1629" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ba1629" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f1020"/>
      <stop offset=".5" stop-color="#f02a43"/>
      <stop offset="1" stop-color="#8f1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="640" cy="180" rx="420" ry="260" fill="url(#glow)"/>

  <g transform="translate(640 82)">
    <ellipse rx="72" ry="86" fill="#d51e35" opacity=".2" filter="url(#softGlow)"/>
    <image x="-25" y="-58" width="50" height="144" preserveAspectRatio="xMidYMid meet"
           href="data:image/png;base64,"/>
  </g>

  <text x="640" y="196" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700"
        letter-spacing="7" text-anchor="middle">REYHANE.INFO</text>
  <text x="640" y="238" fill="#c8c8ce" font-family="Inter, Arial, sans-serif" font-size="18"
        letter-spacing="1.5" text-anchor="middle">DIGITAL INFRASTRUCTURE FOR REYHANE AL-NABI</text>

  <g transform="translate(640 286)">
    <path d="M-265 0H-105" stroke="#ffffff" stroke-opacity=".13"/>
    <circle cx="-88" r="2.5" fill="#e5233b"/>
    <text fill="#9d9da6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"
          letter-spacing="3" text-anchor="middle">MEDIA  •  TECHNOLOGY  •  EXPERIENCE</text>
    <circle cx="88" r="2.5" fill="#e5233b"/>
    <path d="M105 0H265" stroke="#ffffff" stroke-opacity=".13"/>
  </g>

  <path d="M28 330C190 310 324 326 454 344" fill="none" stroke="#d71e35" stroke-opacity=".22" stroke-width="2"/>
  <path d="M826 344C956 326 1090 310 1252 330" fill="none" stroke="#d71e35" stroke-opacity=".22" stroke-width="2"/>
  <rect x=".75" y=".75" width="1278.5" height="358.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
</svg>
